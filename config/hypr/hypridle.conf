general {
    lock_cmd = bash ~/.config/hypr/scripts/macos_lock.sh 'pidof hyprlock || hyprlock'
    before_sleep_cmd = bash ~/.config/hypr/scripts/macos_lock.sh 'loginctl lock-session'
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
