# Pin Hyprland to Intel Iris Xe iGPU so NVIDIA RTX 3050 sleeps in D3cold on battery.
# Launch games/3D apps on RTX 3050 via: prime-run <app>
# NOTA: no usar /dev/dri/by-path/pci-0000:00:02.0-card — AQ_DRM_DEVICES separa por ':'
# y esa ruta contiene ':' (pci-0000:00:02.0), lo que rompe el arranque de Hyprland.
AQ_DRM_DEVICES=/dev/dri/card1
LIBVA_DRIVER_NAME=iHD
